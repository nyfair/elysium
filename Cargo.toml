[package]
name = "elysium"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0", default-features = false, features = ["png"] }
rustfft = "6"
windows-capture = "2"
windows = { version = "0", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Foundation", "Graphics", "Graphics_Capture", "Graphics_DirectX", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture"] }
serde_json = "1"
vigem-client = "0"
rhai = { version = "1", features = ["sync"] }
ratatui = "0"
fast_image_resize = { version = "6", default-features = false, features = ["image"] }
ocr-rs = { path = "rust-paddle-ocr", optional = true }

[[bin]]
name = "obs64"
path = "src/main.rs"

[features]
default = ["dna", "nte"]
dna = []
nte = ["ocr"]
ocr = ["dep:ocr-rs"]

[profile.release]
strip = true
lto = true
codegen-units = 1

[profile.dev]
opt-level = 3
