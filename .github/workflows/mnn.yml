name: mnn

on:
  workflow_dispatch:

jobs:
  mnn:
    runs-on: windows-latest
    steps:
    - uses: ilammy/msvc-dev-cmd@v1
    - name: Compile
      run: |
        gh release download -R alibaba/MNN --archive=zip
        7z x *.zip -bse0
        cd MNN*
        sed -i '/The device supports/,+1d' source/backend/cpu/CPURuntime.cpp
        sed -i '/\/Zi"/d' CMakeLists.txt
        mkdir build
        cd build
        cmake .. -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DMNN_BUILD_SHARED_LIBS=OFF -DMNN_BUILD_TOOLS=OFF
        cmake --build .
        mkdir ../../lib
        move *.lib ../../lib/
        move ../include ../../
        cd ../../
        7z a mnn_bindings.7z include lib
    - name: Upload
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: mnn_bindings.7z
        tag: latest
        overwrite: true
        file_glob: true
